[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yaslowfast"
version = "0.1.0"
description = "Binary video classification with SlowFast-R50, WebDataset and PyTorch DDP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch==2.14.1",
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "PyYAML>=6.0.2,<7",
  "webdataset>=1.0.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11"]
export = [
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  "onnxscript==0.7.2",
  "onnx-ir==1.1.0",
]

[project.scripts]
yaslowfast-prepare = "yaslowfast.prepare:main"
yaslowfast-train = "yaslowfast.train:main"
yaslowfast-evaluate = "yaslowfast.evaluate:main"
yaslowfast-predict = "yaslowfast.predict:main"
yaslowfast-export = "yaslowfast.export:main"
yaslowfast-benchmark = "yaslowfast.benchmark:main"
yaslowfast-stats = "yaslowfast.stats:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yaslowfast"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "yaslowfast/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: subprocess or video integration test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
